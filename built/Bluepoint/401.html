<!doctype html>
<html
  data-wf-page="6782b86e73c11828c2b14f2b"
  data-wf-site="6782b86e73c11828c2b14f08"
  lang="en"
>
  <head>
    <meta charset="utf-8" />
    <title>BluePoint</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />

    <link href="css/normalize.css" rel="stylesheet" type="text/css" />
    <link href="css/components.css" rel="stylesheet" type="text/css" />
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <script src="js/webfont.js" type="text/javascript"></script>
    <script type="text/javascript">
      WebFont.load({
        google: { families: ["Great Vibes:400", "Anton:regular"] },
      });
    </script>
    <script type="text/javascript">
      !(function (o, c) {
        var n = c.documentElement,
          t = " w-mod-";
        ((n.className += t + "js"),
          ("ontouchstart" in o ||
            (o.DocumentTouch && c instanceof DocumentTouch)) &&
            (n.className += t + "touch"));
      })(window, document);
    </script>
    <link href="images/favicon.svg" rel="shortcut icon" type="image/x-icon" />
    <link href="images/webclip.svg" rel="apple-touch-icon" />
  </head>
  <body>
    <div class="utility-page-wrap password-page-wrap">
      <div class="utility-page-content w-password-page w-form">
        <form
          action="#"
          method="post"
          id="email-form"
          name="email-form"
          data-name="Email Form"
          class="utility-page-form password-form w-password-page"
          data-wf-page-id="6782b86e73c11828c2b14f2b"
          data-wf-element-id="658e9421435c5e9025d7819700000000000c"
        >
          <div class="pw-master">
            <h2 class="no-margins">Protected page</h2>
            <input
              class="text-field w-password-page w-input"
              autofocus="true"
              maxlength="256"
              name="pass"
              data-name="field"
              placeholder="Enter password"
              type="password"
              id="pass"
            />
            <div class="cta-main outlined-dark">
              <input
                type="submit"
                data-wait="Please wait..."
                class="submit-button w-password-page w-button"
                value="Submit"
              />
              <div class="button-bg submit-bg"></div>
              <div class="button-text">Submit</div>
            </div>
          </div>
          <div class="w-password-page w-form-fail">
            <div>Incorrect password. Please try again.</div>
          </div>
          <div style="display: none" class="w-password-page w-embed w-script">
          </div>
          <div style="display: none" class="w-password-page w-embed w-script">
            <script type="application/javascript">
              (function _handlePasswordPageOnload() {
                if (/[?&]e=1(&|$)/.test(document.location.search)) {
                  document.querySelector(
                    ".w-password-page.w-form-fail",
                  ).style.display = "block";
                }
              })();
            </script>
          </div>
        </form>
      </div>
    </div>
    <script src="js/jquery.min.js"></script>
    <script src="js/main.js" type="text/javascript"></script>
  </body>
</html>
