          </div>
          <h1>This space is held with care</h1>
          <label for="pass" class="hidden w-password-page">Password</label>
          <div class="wrap-input-form">
            <input
              class="text-field password w-password-page w-input"
              autofocus="true"
              maxlength="256"
              name="pass"
              data-name="field"
              placeholder="Enter your password"
              type="password"
              id="pass"

                data-wait="Please wait..."
                class="submit-button transparent-button w-password-page w-button"
                value="Submit"
              />

                  viewbox="0 0 24 27"
                  fill="none"

                      x="-4"
                      y="0"
                      width="32"
                      height="32"
                      filterunits="userSpaceOnUse"
                      color-interpolation-filters="sRGB"
                    >
                      <feflood flood-opacity="0" result="BackgroundImageFix">
                        <fecolormatrix
                          in="SourceAlpha"
                          type="matrix"

                          result="hardAlpha"

                                  </feblend>
                                </fecolormatrix>
                              </fecomposite>

                          </feoffset>
                        </fecolormatrix>
                      </feflood>
                    </filter>

                </svg>
              </div>
            </div>
          </div>
          <div class="w-password-page w-form-fail">
            <div>Incorrect password. Please try again.</div>

          </div>
          <div style="display: none" class="w-password-page w-embed w-script">
            <script type="application/javascript">
              (function _handlePasswordPageOnload() {
                if (/[?&]e=1(&|$)/.test(document.location.search)) {
                  document.querySelector(
                    ".w-password-page.w-form-fail",
                  ).style.display = "block";

    <script src="js/jquery.min.js"></script>

    <script src="js/gsap.min.js" type="text/javascript"></script>

    <script src="js/SplitText.min.js" type="text/javascript"></script>

    />

      let lenis = new Lenis({
        lerp: 0.1,
        wheelMultiplier: 0.7,
        gestureOrientation: "vertical",
        normalizeWheel: false,
        smoothTouch: false,
      });
      function raf(time) {

        requestAnimationFrame(raf);
      }
      requestAnimationFrame(raf);
