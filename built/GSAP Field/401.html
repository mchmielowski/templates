<!doctype html>
<html
  data-wf-page="6851958ef29f498fc80cb5bc"
  data-wf-site="6851958ef29f498fc80cb5c1"
  lang="en"
>
  <head>
    <meta charset="utf-8" />
    <title>Protected page</title>
    <meta content="Protected page" property="og:title" />
    <meta content="Protected page" property="twitter:title" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />

    <link href="css/normalize.css" rel="stylesheet" type="text/css" />
    <link href="css/components.css" rel="stylesheet" type="text/css" />
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link
      href="https://fonts.gstatic.com"
      rel="preconnect"
      crossorigin="anonymous"
    />
    <script src="js/webfont.js" type="text/javascript"></script>
    <script type="text/javascript">
      WebFont.load({
        google: {
          families: [
            "Instrument Sans:regular,500,600,700,italic,500italic,600italic,700italic",
            "Instrument Serif:regular,italic",
          ],
        },
      });
    </script>
    <script type="text/javascript">
      !(function (o, c) {
        var n = c.documentElement,
          t = " w-mod-";
        ((n.className += t + "js"),
          ("ontouchstart" in o ||
            (o.DocumentTouch && c instanceof DocumentTouch)) &&
            (n.className += t + "touch"));
      })(window, document);
    </script>
    <link href="images/favicon.svg" rel="shortcut icon" type="image/x-icon" />
    <link href="images/webclip.svg" rel="apple-touch-icon" />
  </head>
  <body>
    <div class="utility-page-wrap pw">
      <div class="utility-page-content pw w-password-page w-form">
        <form
          action="/.wf_auth"
          method="post"
          id="email-form"
          name="email-form"
          data-name="Email Form"
          class="utility-page-form pw w-password-page"
          data-wf-page-id="6851958ef29f498fc80cb5bc"
          data-wf-element-id="685039c3d71d08909dbff77d00000000000c"
        >
          <div class="label">404</div>
          <h1
            data-w-id="685039c3d71d08909dbff77d00000000000e"
            style="opacity: 0; filter: blur(20px)"
          >
            Access Granted
          </h1>
          <label for="pass" class="hidden w-password-page">Password</label>
          <div class="wrap-input-form">
            <input
              class="text-field w-password-page w-input"
              autofocus="true"
              maxlength="256"
              name="pass"
              data-name="field"
              placeholder="Enter your password"
              type="password"
              id="pass"
            />
            <div class="wrap-submit-button">
              <input
                type="submit"
                data-wait="Please wait..."
                class="submit-button w-password-page w-button"
                value="Submit"
              />
              <div class="cta-arrow w-embed">
                <svg
                  width="100%"
                  height="100%"
                  viewbox="0 0 8 14"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M1 13L7 7L1 1"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
              </div>
            </div>
          </div>
          <div class="w-password-page w-form-fail">
            <div>Incorrect password. Please try again.</div>
          </div>
          <div style="display: none" class="w-password-page w-embed w-script">
            <input
              type="hidden"
              name="path"
              value="<%WF_FORM_VALUE_PATH%>"
            /><input type="hidden" name="page" value="<%WF_FORM_VALUE_PAGE%>" />
          </div>
          <div style="display: none" class="w-password-page w-embed w-script">
            <script type="application/javascript">
              (function _handlePasswordPageOnload() {
                if (/[?&]e=1(&|$)/.test(document.location.search)) {
                  document.querySelector(
                    ".w-password-page.w-form-fail",
                  ).style.display = "block";
                }
              })();
            </script>
          </div>
        </form>
      </div>
    </div>
    <script src="js/jquery.min.js"></script>
    <script src="js/main.js" type="text/javascript"></script>
    <script src="js/gsap.min.js" type="text/javascript"></script>
    <script src="js/Flip.min.js" type="text/javascript"></script>
    <script src="js/SplitText.min.js" type="text/javascript"></script>
    <script src="js/ScrollTrigger.min.js" type="text/javascript"></script>
    <script type="text/javascript">
      gsap.registerPlugin(Flip, SplitText, ScrollTrigger);
    </script>
  </body>
</html>
