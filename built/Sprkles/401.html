<!doctype html>
<html
  data-wf-page="692f17afc3743c9cd4b7cab1"
  data-wf-site="692f17afc3743c9cd4b7cac6"
  lang="en"
>
  <head>
    <meta charset="utf-8" />
    <title>Protected page</title>
    <meta
      content="Sparkles is a warm and easy-to-use template for cleaning companies. Clear service pages, transparent pricing, booking flows, and a friendly design — everything you need to build trust and get more customers."
      name="description"
    />
    <meta content="Protected page" property="og:title" />
    <meta
      content="Sparkles is a warm and easy-to-use template for cleaning companies. Clear service pages, transparent pricing, booking flows, and a friendly design — everything you need to build trust and get more customers."
      property="og:description"
    />
    <meta
      content="images/69300e781ded91a7d6dc8345_8cc6c80d2dab86685f74747afdd1d667_OG.jpg"
      property="og:image"
    />
    <meta content="Protected page" property="twitter:title" />
    <meta
      content="Sparkles is a warm and easy-to-use template for cleaning companies. Clear service pages, transparent pricing, booking flows, and a friendly design — everything you need to build trust and get more customers."
      property="twitter:description"
    />
    <meta property="og:type" content="website" />
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />

    <link href="css/normalize.css" rel="stylesheet" type="text/css" />
    <link href="css/components.css" rel="stylesheet" type="text/css" />
    <link href="css/styles.css" rel="stylesheet" type="text/css" />
    <style>
      html.w-mod-js:not(.w-mod-ix3)
        :is([button-icon-right], [cms-image], .link-underline_fill-line) {
        visibility: hidden !important;
      }
    </style>
    <script type="text/javascript">
      !(function (o, c) {
        var n = c.documentElement,
          t = " w-mod-";
        ((n.className += t + "js"),
          ("ontouchstart" in o ||
            (o.DocumentTouch && c instanceof DocumentTouch)) &&
            (n.className += t + "touch"));
      })(window, document);
    </script>
    <link href="images/favicon.svg" rel="shortcut icon" type="image/x-icon" />
    <link href="images/webclip.svg" rel="apple-touch-icon" />
    <style>
      * {
        -webkit-font-smoothing: antialiased; /* For WebKit (Safari, Chrome) */
        -moz-osx-font-smoothing: grayscale; /* For macOS Firefox */
        font-smoothing: antialiased; /* Non-standard, fallback */
        text-rendering: optimizeLegibility; /* Improves kerning and ligatures */
      }
    </style>
  </head>
  <body>
    <div
      data-animation="default"
      data-collapse="medium"
      data-duration="400"
      data-easing="ease"
      data-easing2="ease"
      role="banner"
      class="nav-simple w-nav"
    >
      <div class="nav-simple_container">
        <a href="index.html" class="brand_nav w-nav-brand"
          ><img
            src="images/sparkles-logo.svg"
            loading="lazy"
            alt="logo footer"
            class="nav-logo"
        /></a>
      </div>
    </div>
    <div class="utility_page-wrap pw">
      <div class="utility_page-content pw w-password-page w-form">
        <form
          action="/.wf_auth"
          method="post"
          id="email-form"
          name="email-form"
          data-name="Email Form"
          class="utility_page-form pw w-password-page"
          data-wf-page-id="692f17afc3743c9cd4b7cab1"
          data-wf-element-id="685039c3d71d08909dbff77d00000000000c"
        >
          <div class="headline_pw">
            <h1 class="heading-style-h2">Something fresh is coming soon</h1>
            <div class="subtext_pw">
              <p class="text-size-large">
                The page you’re looking for is in the middle of a deep clean, a
                glow-up, and maybe a tiny identity crisis.
              </p>
            </div>
          </div>
          <label for="pass" class="hide w-password-page">Password</label>
          <div class="wrap_input-form pw">
            <input
              class="text-field w-password-page w-input"
              autofocus="true"
              maxlength="256"
              name="pass"
              data-name="field"
              placeholder="Enter your password"
              type="password"
              id="pass"
            />
            <div class="wrap_submit-button">
              <input
                type="submit"
                data-wait="Please wait..."
                class="button_submit w-password-page w-button"
                value="Submit"
              />
              <div class="input_icon w-embed">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="100%"
                  height="100%"
                  viewbox="0 0 20 20"
                  fill="none"
                >
                  <path
                    d="M7.5 15L12.5 10L7.5 5"
                    stroke="currentColor"
                    stroke-width="var(--icon-icon-stroke)"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
              </div>
            </div>
          </div>
          <div class="error-message w-password-page w-form-fail">
            <div>Incorrect password. Please try again.</div>
          </div>
          <div style="display: none" class="w-password-page w-embed w-script">
            <input
              type="hidden"
              name="path"
              value="<%WF_FORM_VALUE_PATH%>"
            /><input type="hidden" name="page" value="<%WF_FORM_VALUE_PAGE%>" />
          </div>
          <div style="display: none" class="w-password-page w-embed w-script">
            <script type="application/javascript">
              (function _handlePasswordPageOnload() {
                if (/[?&]e=1(&|$)/.test(document.location.search)) {
                  document.querySelector(
                    ".w-password-page.w-form-fail",
                  ).style.display = "block";
                }
              })();
            </script>
          </div>
        </form>
      </div>
    </div>
    <script src="js/jquery.min.js"></script>
    <script src="js/main.js" type="text/javascript"></script>
    <script src="js/gsap.min.js" type="text/javascript"></script>
    <script src="js/ScrollTrigger.min.js" type="text/javascript"></script>
    <script type="text/javascript">
      gsap.registerPlugin(ScrollTrigger);
    </script>
    <script>
      gsap.set("[data-marquee-inner]", { xPercent: -50 });
      // Animate all marquees
      let tween = gsap.to("[data-marquee-part]", {
        xPercent: -100,
        repeat: -1,
        duration: 45,
        ease: "linear",
      });
      // Select all marquees, not just one
      document.querySelectorAll("[data-marquee-inner]").forEach((marquee) => {
        marquee.addEventListener("mouseenter", () => {
          gsap.to(tween, { timeScale: 0.3, duration: 0.5, ease: "power1.out" });
        });
        marquee.addEventListener("mouseleave", () => {
          gsap.to(tween, { timeScale: 1, duration: 0.5, ease: "power1.in" });
        });
      });
    </script>
  </body>
</html>
